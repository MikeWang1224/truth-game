<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1422" media="(prefers-color-scheme: dark)">
<title>真心話轉盤</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="turn_config.js"></script>
<style>
:root{
 --bg1:#ffeef4;--bg2:#fff7fa;--glow:rgba(255,255,255,.85);
 --card:rgba(255,255,255,.8);--ink:#3a2434;--mute:#8f7585;--line:#f6d9e4;
 --pink:#ff6a96;--pink2:#ff9db8;--blue:#8f8cff;--blue2:#b9b3ff;--title:#d93a78;
 --shadow:0 12px 32px rgba(214,90,140,.14);
 --rim1:#ffffff;--rim2:#ffd0e0;--field:rgba(255,255,255,.88);
 --s1:rgba(255,255,255,.62);--s2:#ffd1e1;--s3:#ffb0cb;--lav:#d6caff;--cloud:rgba(255,255,255,.8)
}
@media (prefers-color-scheme:dark){:root{
 --bg1:#1f1329;--bg2:#2b1737;--glow:rgba(255,106,150,.14);
 --card:rgba(48,32,60,.82);--ink:#fbeff6;--mute:#bba4b8;--line:#493058;
 --title:#ff9fc4;--shadow:0 12px 32px rgba(0,0,0,.4);
 --rim1:#5a3a6e;--rim2:#3a2448;--field:rgba(0,0,0,.25);
 --s1:rgba(255,255,255,.05);--s2:#47285a;--s3:#633478;--lav:#4f4690;--cloud:rgba(255,255,255,.06)
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;min-height:100%;background-color:var(--bg1);
 background-image:radial-gradient(760px 460px at 15% -5%,var(--glow),transparent 65%),linear-gradient(180deg,var(--bg1),var(--bg2));
 background-repeat:no-repeat;background-size:100% 100%;overscroll-behavior:none}
body{margin:0;color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Hiragino Sans CNS",sans-serif;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;background:transparent;overscroll-behavior:none}

/* ---- 背景:粉色遊樂園 ---- */
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg svg{position:absolute;display:block}
.bg .scene{left:0;bottom:0;width:100%;height:auto;max-height:78vh;overflow:visible}
.bg .bunting{left:0;top:0;width:100%;height:clamp(44px,6vw,80px)}
.bg .s1{fill:var(--s1)}.bg .s2{fill:var(--s2)}.bg .s3{fill:var(--s3)}.bg .lv{fill:var(--lav)}.bg .cl{fill:var(--cloud)}
.bg .l3{stroke:var(--s3);fill:none;stroke-linecap:round}.bg .l2{stroke:var(--s2);fill:none;stroke-linecap:round}
.fw{transform-origin:680px 300px;animation:spin 120s linear infinite}
.bl{animation:floaty 7s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

main{position:relative;z-index:1;width:100%;max-width:520px;padding:max(22px,env(safe-area-inset-top)) 16px max(36px,env(safe-area-inset-bottom))}
header{text-align:center;margin:22px 0 20px}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--title);padding:4px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
h1{margin:10px 0 4px;font-size:clamp(34px,9vw,46px);line-height:1.1;font-weight:800;letter-spacing:.06em;color:var(--title);text-shadow:0 2px 0 rgba(255,255,255,.6)}
@media (prefers-color-scheme:dark){h1{text-shadow:none}}
.sub{margin:0;font-size:14px;color:var(--mute)}

.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:20px;color:var(--title)}
.card .lead{margin:0 0 6px;font-size:13px;color:var(--mute)}
label{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:14px;font-weight:700;margin:16px 0 4px}
label em{font-style:normal;font-weight:400;font-size:12px;color:var(--mute)}
input[type=text]{width:100%;padding:13px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
input[type=text]::placeholder{color:var(--mute);opacity:.7}
input[type=text]:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,106,150,.18)}

button{font:inherit;border:0;border-radius:99px;padding:14px 18px;background:linear-gradient(135deg,#ff86ab,#ff5c8a);color:#fff;font-weight:800;font-size:17px;letter-spacing:.06em;cursor:pointer;width:100%;margin-top:18px;box-shadow:0 8px 20px rgba(255,92,138,.32);transition:transform .15s,box-shadow .15s,opacity .2s}
button:hover{transform:translateY(-1px)}button:active{transform:translateY(1px) scale(.99)}
button:focus-visible{outline:3px solid rgba(255,106,150,.5);outline-offset:3px}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600;font-size:13px;letter-spacing:0;width:auto;padding:9px 14px;margin:0}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
#next:disabled{background:#c9c9d3;box-shadow:none;opacity:1;color:#fff}
#spin{font-size:20px;padding:16px;margin-top:20px;background:linear-gradient(135deg,#ff86ab,#ff5c8a);box-shadow:0 0 0 6px rgba(255,255,255,.5),0 12px 26px rgba(255,92,138,.38)}
@media (prefers-color-scheme:dark){#spin{box-shadow:0 0 0 6px rgba(255,255,255,.08),0 12px 26px rgba(255,92,138,.3)}}
.small{font-size:13px;color:var(--mute)}
.hidden{display:none!important}

.players{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.pl{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-width:0;padding:8px 14px;border-radius:99px;font-weight:700;font-size:14px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pl::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:#fff;opacity:.9}
.pl0{justify-self:start;background:linear-gradient(135deg,var(--pink),var(--pink2))}.pl1{justify-self:end;background:linear-gradient(135deg,var(--blue),var(--blue2))}
.vs{justify-self:center;font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.1em}
#status{text-align:center;margin-top:10px;min-height:18px}
#game>.card:first-child{position:relative;padding-top:24px}
.roomtab{position:absolute;top:-11px;right:16px;max-width:calc(100% - 32px);display:flex;align-items:center;gap:7px;padding:4px 12px 4px 9px;border-radius:99px;background:var(--bg2);border:1px solid var(--pink2);box-shadow:0 4px 10px rgba(214,90,140,.18)}
.roomlbl{flex:none;font-size:11px;font-weight:700;color:var(--mute)}
#roomtag{min-width:0;font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--title);overflow-wrap:anywhere;line-height:1.3}

/* ---- 轉盤(簡化) ---- */
.stage{display:flex;justify-content:center;margin:40px 0 22px}
.wheelwrap{position:relative;width:min(80vw,340px);aspect-ratio:1}
.ring{position:absolute;inset:-10px;border-radius:50%;background:linear-gradient(145deg,var(--rim1),var(--rim2));box-shadow:0 14px 34px rgba(214,90,140,.25)}
.pointer{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:28px solid #ff4f86;z-index:3;filter:drop-shadow(0 3px 3px rgba(120,20,60,.3))}
#wheel{position:relative;z-index:1;width:100%;height:100%;display:block;border-radius:50%}
#t0,#t1{paint-order:stroke;stroke:rgba(120,30,70,.28);stroke-width:2px}
.hub{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.55),0 4px 12px rgba(120,30,70,.3);pointer-events:none}
.hub::after{content:"";position:absolute;inset:32%;border-radius:50%;background:var(--pink)}

.result{text-align:center;position:relative;margin-top:16px;padding-top:26px;border:2px solid var(--pink2)}
.result::before{content:"Q";position:absolute;top:-17px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff86ab,#ff5c8a);box-shadow:0 4px 10px rgba(255,92,138,.4)}
.result:not(.hidden){animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.who{font-size:15px;color:var(--mute)}.who b{color:var(--ink);font-size:22px}
.me{color:var(--pink)!important}
.q{font-size:clamp(20px,5.4vw,24px);line-height:1.6;font-weight:800;padding:12px 2px 10px}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
#hist{margin-top:12px;max-height:320px;overflow:auto}
footer{text-align:center;margin-top:22px;font-size:12px;color:var(--mute)}

@media (min-width:760px){main{max-width:580px;padding-top:44px}.wheelwrap{width:380px}.card{padding:24px}}
@media (max-width:520px){
 main{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
 header{margin:14px 0 12px}h1{margin:6px 0 2px}
 .card{padding:16px;margin-bottom:10px;border-radius:20px}
 .stage{margin:30px 0 16px}.wheelwrap{width:min(68vw,290px)}
 #spin{padding:13px;font-size:18px}.q{padding:8px 2px 6px}
 .result{margin-top:12px}footer{margin-top:14px}
}

/* ---- 蓄力按鈕特效 ---- */
#game{--p:0}
.spinwrap{position:relative}
#spin{position:relative;z-index:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#spin::before{content:"";position:absolute;z-index:-1;left:0;top:0;bottom:0;width:calc(var(--p)*100%);background:linear-gradient(90deg,#ffb36b,#ffe27a);border-radius:inherit;opacity:0}
#spin.charging{transition:none;animation:jitter .11s linear infinite;text-shadow:0 1px 3px rgba(150,40,60,.55);
 box-shadow:0 0 0 calc(6px + var(--p)*8px) rgba(255,170,90,calc(.2 + var(--p)*.35)),0 0 calc(var(--p)*44px) calc(var(--p)*8px) rgba(255,120,70,calc(var(--p)*.85)),0 12px 26px rgba(255,92,138,.38)}
#spin.charging::before{opacity:.95}
#spin.max{background:linear-gradient(135deg,#ff7a3d,#ff3d7a)}
@keyframes jitter{
 0%{transform:translate(0,0) scale(calc(1 + var(--p)*.04))}
 25%{transform:translate(calc(var(--p)*-2px),calc(var(--p)*1px)) scale(calc(1 + var(--p)*.04))}
 50%{transform:translate(calc(var(--p)*1.5px),calc(var(--p)*-1.5px)) scale(calc(1 + var(--p)*.04))}
 75%{transform:translate(calc(var(--p)*1px),calc(var(--p)*1.5px)) scale(calc(1 + var(--p)*.04))}
 100%{transform:translate(0,0) scale(calc(1 + var(--p)*.04))}}
.wheelwrap.charging{animation:jitter2 .09s linear infinite}
.wheelwrap.charging .ring{box-shadow:0 14px 34px rgba(214,90,140,.25),0 0 calc(var(--p)*56px) calc(var(--p)*12px) rgba(255,140,80,calc(var(--p)*.7))}
@keyframes jitter2{0%,100%{transform:translate(0,0)}33%{transform:translate(calc(var(--p)*-1.5px),calc(var(--p)*1px))}66%{transform:translate(calc(var(--p)*1.5px),calc(var(--p)*-1px))}}
.sp{position:absolute;pointer-events:none;width:9px;height:9px;margin:-4px 0 0 -4px;z-index:2;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spark .8s ease-out forwards}
@keyframes spark{from{opacity:1;transform:translate(0,0) scale(1) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg)}}
/* ---- 背景跟隨當地天氣與時間(按右上角太陽開關) ---- */
:root[data-phase="day"]{--bg1:#bfe4ff;--bg2:#f2fbff;--glow:rgba(255,240,170,.75);--card:rgba(255,255,255,.8);--ink:#3a2434;--mute:#5f5470;--line:#cde4f3;--title:#c9306c;--shadow:0 12px 32px rgba(70,140,200,.18);--rim1:#ffffff;--rim2:#cfe7fa;--field:rgba(255,255,255,.88);--s1:rgba(255,255,255,.7);--s2:#bfe0fb;--s3:#8ec6f2;--lav:#d2d9ff;--cloud:rgba(255,255,255,.85)}
:root[data-phase="dawn"]{--bg1:#ffd2bd;--bg2:#fff0e4;--glow:rgba(255,196,130,.7);--card:rgba(255,255,255,.8);--ink:#3a2434;--mute:#6b4a52;--line:#f6d6c6;--title:#c42a5e;--shadow:0 12px 32px rgba(214,110,90,.16);--rim1:#ffffff;--rim2:#ffd9c2;--field:rgba(255,255,255,.88);--s1:rgba(255,255,255,.62);--s2:#ffd1bb;--s3:#ffb08e;--lav:#f0cfe8;--cloud:rgba(255,255,255,.8)}
:root[data-phase="dusk"]{--bg1:#c9a8e6;--bg2:#ffd0b0;--glow:rgba(255,150,120,.5);--card:rgba(255,255,255,.78);--ink:#3a2434;--mute:#4c3350;--line:#e6cfe6;--title:#7a1f55;--shadow:0 12px 32px rgba(120,70,150,.2);--rim1:#ffffff;--rim2:#f0d0e8;--field:rgba(255,255,255,.88);--s1:rgba(255,255,255,.55);--s2:#e3c4ec;--s3:#d49ccd;--lav:#c8b8f5;--cloud:rgba(255,255,255,.7)}
:root[data-phase="night"]{--bg1:#0c1033;--bg2:#261b52;--glow:rgba(120,130,255,.18);--card:rgba(30,30,66,.84);--ink:#f4eefc;--mute:#b8b4d8;--line:#3d3c78;--title:#ff9fc4;--shadow:0 12px 32px rgba(0,0,0,.45);--rim1:#4a4a8c;--rim2:#2a2a62;--field:rgba(0,0,0,.28);--s1:rgba(255,255,255,.05);--s2:#2c2b66;--s3:#403d8c;--lav:#4c47a8;--cloud:rgba(255,255,255,.07)}
html[data-phase="night"] h1{text-shadow:none}
html{--tint:transparent;--cloudc:rgba(255,255,255,.8);--fogc:rgba(240,244,248,.65);--raincol:rgba(70,110,175,.75);--snowedge:rgba(140,165,210,.85)}
html[data-wx="cloudy"]{--tint:rgba(150,160,175,.26);--cloudc:rgba(190,198,212,.8)}
html[data-wx="rain"]{--tint:rgba(110,125,150,.42);--cloudc:rgba(150,160,180,.78)}
html[data-wx="storm"]{--tint:rgba(55,60,90,.5);--cloudc:rgba(95,100,125,.88)}
html[data-wx="fog"]{--tint:rgba(236,240,245,.5)}
html[data-wx="snow"]{--tint:rgba(235,242,255,.3)}
html[data-phase="night"]{--cloudc:rgba(160,170,215,.22);--fogc:rgba(120,130,170,.4);--raincol:rgba(205,225,255,.7);--snowedge:rgba(255,255,255,.35)}
html[data-phase="night"][data-wx="cloudy"]{--tint:rgba(20,22,45,.25)}
html[data-phase="night"][data-wx="rain"]{--tint:rgba(15,20,45,.35)}
html[data-phase="night"][data-wx="storm"]{--tint:rgba(5,5,20,.45)}
html[data-phase="night"][data-wx="fog"]{--tint:rgba(120,130,160,.25)}
html[data-phase="night"][data-wx="snow"]{--tint:rgba(150,165,200,.2)}
#skyfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 1.2s}
html[data-sky] #skyfx{opacity:1}
.sx-tint,.sx-sun,.sx-moon,.sx-stars,.sx-cld,.sx-fog,.sx-rain,.sx-snow,.sx-flash{position:absolute;opacity:0;transition:opacity 1.5s}
.sx-tint{inset:0;background:var(--tint)}
html[data-sky] .sx-tint{opacity:1}
.sx-sun{inset:0;--sx:85%;--sy:9%;--sc:255,226,140;background:radial-gradient(circle at var(--sx) var(--sy),rgba(var(--sc),.95) 0 34px,rgba(var(--sc),.38) 35px 92px,rgba(var(--sc),.14) 93px 230px,transparent 360px)}
html[data-phase="dawn"] .sx-sun{--sx:13%;--sy:27%;--sc:255,168,108}
html[data-phase="dusk"] .sx-sun{--sx:87%;--sy:29%;--sc:255,132,108}
html[data-phase="day"][data-wx="clear"] .sx-sun,html[data-phase="dawn"][data-wx="clear"] .sx-sun,html[data-phase="dusk"][data-wx="clear"] .sx-sun{opacity:1}
html[data-phase="day"][data-wx="partly"] .sx-sun,html[data-phase="dawn"][data-wx="partly"] .sx-sun,html[data-phase="dusk"][data-wx="partly"] .sx-sun{opacity:.8}
html[data-phase="day"][data-wx="cloudy"] .sx-sun,html[data-phase="dawn"][data-wx="cloudy"] .sx-sun,html[data-phase="dusk"][data-wx="cloudy"] .sx-sun{opacity:.3}
.sx-moon{inset:0;background:radial-gradient(circle at 84% 10%,#fff6d6 0 20px,rgba(255,246,214,.32) 21px 56px,transparent 130px)}
.sx-stars{inset:0}
.sx-stars::after{content:"";position:absolute;inset:0;animation:twinkle 3.6s ease-in-out infinite alternate;
 background-image:radial-gradient(1.6px 1.6px at 8% 12%,#fff,transparent),radial-gradient(2px 2px at 22% 6%,#fff,transparent),radial-gradient(1.6px 1.6px at 37% 16%,#fff,transparent),radial-gradient(2.2px 2.2px at 52% 8%,#fff,transparent),radial-gradient(1.6px 1.6px at 66% 20%,#fff,transparent),radial-gradient(2px 2px at 74% 5%,#fff,transparent),radial-gradient(1.6px 1.6px at 92% 24%,#fff,transparent),radial-gradient(2px 2px at 15% 30%,#fff,transparent),radial-gradient(1.6px 1.6px at 45% 33%,#fff,transparent),radial-gradient(2.2px 2.2px at 83% 38%,#fff,transparent),radial-gradient(1.6px 1.6px at 6% 46%,#fff,transparent),radial-gradient(2px 2px at 60% 44%,#fff,transparent)}
@keyframes twinkle{from{opacity:.4}to{opacity:1}}
html[data-phase="night"][data-wx="clear"] .sx-moon,html[data-phase="night"][data-wx="clear"] .sx-stars{opacity:1}
html[data-phase="night"][data-wx="partly"] .sx-moon,html[data-phase="night"][data-wx="partly"] .sx-stars{opacity:.8}
html[data-phase="night"][data-wx="cloudy"] .sx-moon,html[data-phase="night"][data-wx="cloudy"] .sx-stars{opacity:.35}
.sx-cld{left:0;width:200px;height:56px;border-radius:99px;background:var(--cloudc);filter:blur(9px);animation:drift 90s linear infinite;
 box-shadow:70px -26px 0 -6px var(--cloudc),-46px -16px 0 -10px var(--cloudc)}
.sx-c1{top:11%;animation-delay:-20s}
.sx-c2{top:24%;width:280px;height:72px;animation-duration:120s;animation-delay:-75s}
.sx-c3{top:38%;width:230px;height:60px;animation-duration:105s;animation-delay:-45s}
.sx-c4{top:7%;width:180px;height:50px;animation-duration:140s;animation-delay:-100s}
@keyframes drift{from{transform:translateX(-340px)}to{transform:translateX(calc(100vw + 340px))}}
html[data-wx="partly"] .sx-c1,html[data-wx="partly"] .sx-c2{opacity:1}
html[data-wx="cloudy"] .sx-cld,html[data-wx="rain"] .sx-cld,html[data-wx="storm"] .sx-cld,html[data-wx="snow"] .sx-cld,html[data-wx="fog"] .sx-cld{opacity:1}
.sx-rain{left:-30%;top:-160px;width:160%;height:calc(100% + 320px);transform:rotate(12deg)}
.sx-rain::before,.sx-rain::after{content:"";position:absolute;inset:0}
.sx-rain::before{background-image:radial-gradient(ellipse 1.6px 11px at 10px 24px,var(--raincol),transparent),radial-gradient(ellipse 1.6px 11px at 34px 92px,var(--raincol),transparent),radial-gradient(ellipse 1.6px 11px at 58px 52px,var(--raincol),transparent),radial-gradient(ellipse 1.6px 11px at 76px 118px,var(--raincol),transparent),radial-gradient(ellipse 1.6px 11px at 22px 66px,var(--raincol),transparent);background-size:90px 140px;animation:fall140 .55s linear infinite}
.sx-rain::after{background-image:radial-gradient(ellipse 1.6px 11px at 20px 30px,var(--raincol),transparent),radial-gradient(ellipse 1.6px 11px at 70px 150px,var(--raincol),transparent),radial-gradient(ellipse 1.6px 11px at 100px 70px,var(--raincol),transparent),radial-gradient(ellipse 1.6px 11px at 40px 110px,var(--raincol),transparent),radial-gradient(ellipse 1.6px 11px at 115px 24px,var(--raincol),transparent);background-size:130px 190px;animation:fall190 .8s linear infinite}
@keyframes fall140{to{transform:translateY(140px)}}
@keyframes fall190{to{transform:translateY(190px)}}
html[data-wx="rain"] .sx-rain,html[data-wx="storm"] .sx-rain{opacity:1}
.sx-snow{left:-10%;top:-320px;width:120%;height:calc(100% + 640px)}
.sx-snow::before,.sx-snow::after{content:"";position:absolute;inset:0}

  if(e&&e.pointerId!=null){try{spinBtn.setPointerCapture(e.pointerId)}catch(x){}}
  audio();
  ch={t0:performance.now(),p:0,pct:-1,step:0,raf:0,tone:toneStart()};
  spinBtn.classList.add("charging");wheelWrap.classList.add("charging");
  sendCharge(true);
  chargeLoop();
}
function chargeEnd(fire){
  if(!ch)return;
  var p=Math.min(1,(performance.now()-ch.t0)/HOLD_MAX);
  cancelAnimationFrame(ch.raf);toneStop(ch.tone);ch=null;sendCharge(false);
  spinBtn.classList.remove("charging","max");wheelWrap.classList.remove("charging");
  setPower(0);spinBtn.textContent=spinLabel();
  if(fire&&connected&&!busy&&!spinBtn.disabled){
    haptic(20+Math.round(p*40))
    if(!reduceMotion)sparkBurst(p);
    if(isHost)doSpin(null,p);
    else{conn.send({type:"req",pw:p});spinBtn.disabled=true;setTimeout(function(){if(!busy)render()},3000)}
  }
}
spinBtn.addEventListener("pointerdown",function(e){if(e.button>0)return;e.preventDefault();chargeStart(e)});
spinBtn.addEventListener("pointerup",function(){chargeEnd(true)});
spinBtn.addEventListener("pointercancel",function(){chargeEnd(false)});
spinBtn.addEventListener("lostpointercapture",function(){chargeEnd(false)});
spinBtn.addEventListener("contextmenu",function(e){e.preventDefault()});
spinBtn.addEventListener("keydown",function(e){if((e.key===" "||e.key==="Enter")&&!e.repeat){e.preventDefault();chargeStart()}});
spinBtn.addEventListener("keyup",function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();chargeEnd(true)}});
spinBtn.addEventListener("blur",function(){chargeEnd(false)});
$("next").onclick=function(){if(!connected||!busy||ansIdx===meIdx())return;conn.send({type:"next"});doNext()};
})();
</script>
<script>
(function(){
var html=document.documentElement,btn=document.getElementById("skybtn"),tip=document.getElementById("skytip");
var KEY="tod_sky",CK="tod_sky_cache",on=false,info=null,pos=null,fetchedAt=0,failAt=0,tipT=0,busy=false,pend=false,recheck=false;
var WXN={clear:"晴天",partly:"多雲時晴",cloudy:"陰天",fog:"起霧",rain:"下雨",snow:"下雪",storm:"雷雨"};
var PHN={dawn:"日出",day:"白天",dusk:"黃昏",night:"夜晚"};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function codeToWx(c){
  if(c===0||c===1)return "clear";if(c===2)return "partly";if(c===3)return "cloudy";
  if(c===45||c===48)return "fog";
  if((c>=51&&c<=67)||(c>=80&&c<=82))return "rain";
  if((c>=71&&c<=77)||c===85||c===86)return "snow";
  if(c>=95)return "storm";
  return "clear";
}
function phase(){
  var M=60000,DAY=864e5,t=Date.now(),sr,ss;
  if(info&&info.sr&&info.ss){sr=info.sr;ss=info.ss}
  else{var a=new Date();a.setHours(6,0,0,0);var b=new Date();b.setHours(18,0,0,0);sr=a.getTime();ss=b.getTime()}
  var k=Math.floor((t-sr+40*M)/DAY);sr+=k*DAY;ss+=k*DAY;      /* 把日出日落平移到「今天」 */
  if(t<sr+60*M)return "dawn";
  if(t<ss-60*M)return "day";
  if(t<ss+40*M)return "dusk";
  return "night";
}
function describe(){
  var ph=phase();
  if(info&&info.ok)return WXN[info.kind]+"・"+PHN[ph];
  return "依本機時間:"+PHN[ph]+(info&&info.why?"("+info.why+")":"");
}
function say(text,ms){
  tip.textContent=text;tip.classList.add("show");
  clearTimeout(tipT);tipT=setTimeout(function(){tip.classList.remove("show")},ms||3000);
}
function apply(){
  if(!on){
    html.removeAttribute("data-sky");html.removeAttribute("data-phase");html.removeAttribute("data-wx");
    btn.setAttribute("aria-pressed","false");btn.title="背景:預設(點一下改成跟隨當地天氣與時間)";
    return;
  }
  html.setAttribute("data-sky","1");
  html.setAttribute("data-phase",phase());
  html.setAttribute("data-wx",info&&info.ok?info.kind:"clear");
  btn.setAttribute("aria-pressed","true");btn.title="背景:跟隨當地("+describe()+"),點一下關閉";
}
/* 快取:座標永久記著(下次不用再等定位),天氣記 3 小時內有效 */
function loadCache(){
  try{
    var c=JSON.parse(ls(CK)||"null");
    if(c&&c.pos&&typeof c.pos.lat==="number"&&typeof c.pos.lon==="number"){
      pos=c.pos;
      if(c.info&&c.info.ok&&Date.now()-c.t<3*3600000){info=c.info;fetchedAt=c.t}
    }
  }catch(e){}
}
function saveCache(){if(pos)ls(CK,JSON.stringify({pos:pos,info:info&&info.ok?info:null,t:fetchedAt}))}
function locate(){
  return new Promise(function(res,rej){
    if(!navigator.geolocation){rej({why:"此瀏覽器不支援定位",denied:true});return}
    navigator.geolocation.getCurrentPosition(
      function(p){res({lat:p.coords.latitude,lon:p.coords.longitude})},
      function(e){var d=!!(e&&e.code===1);rej({why:d?"沒有位置權限":"無法取得位置",denied:d})},
      {timeout:10000,maximumAge:3600000});
  });
}
function fetchWx(q){
  var url="https://api.open-meteo.com/v1/forecast?latitude="+q.lat.toFixed(2)+"&longitude="+q.lon.toFixed(2)+"&current=weather_code,precipitation,rain,showers,snowfall,cloud_cover&daily=sunrise,sunset&timezone=auto&forecast_days=1";
  return fetch(url).then(function(r){if(!r.ok)throw {why:"天氣服務暫時無法使用"};return r.json()}).then(function(j){
    var off=(j.utc_offset_seconds|0)*1000,d=j.daily||{};
    var sr=d.sunrise&&d.sunrise[0]?Date.parse(d.sunrise[0]+"Z")-off:0;
    var ss=d.sunset&&d.sunset[0]?Date.parse(d.sunset[0]+"Z")-off:0;
    var cur=j.current||{},code=(cur.weather_code!=null?cur.weather_code:cur.weathercode)|0;
    var kind=codeToWx(code);
    /* 天氣代碼有時還是「陰天」但其實正在下雨,所以再用降水量、雲量校正 */
    var wet=(cur.precipitation||0)>0||(cur.rain||0)>0||(cur.showers||0)>0,cc=cur.cloud_cover;
    if((cur.snowfall||0)>0&&kind!=="storm")kind="snow";
    else if(wet&&kind!=="snow"&&kind!=="storm")kind="rain";
    else if((kind==="clear"||kind==="partly")&&typeof cc==="number"){
      if(cc>=85)kind="cloudy";else if(cc>=40&&kind==="clear")kind="partly";
    }
    info={ok:true,kind:kind,sr:isNaN(sr)?0:sr,ss:isNaN(ss)?0:ss};
    fetchedAt=Date.now();
  });
}
function relocate(){
  locate().then(function(q){
    var moved=!pos||Math.abs(q.lat-pos.lat)>.2||Math.abs(q.lon-pos.lon)>.2;
    pos=q;saveCache();
    if(moved)refresh(true);
  }).catch(function(){});
}
function refresh(force){
  if(busy)return Promise.resolve();
  if(!force){
    if(info&&info.ok&&Date.now()-fetchedAt<30*60000)return Promise.resolve();
    if(info&&!info.ok&&(info.denied||Date.now()-failAt<10*60000))return Promise.resolve();
  }
  busy=true;
  var fromCache=!!pos;
  var p=pos?Promise.resolve(pos):locate().then(function(q){pos=q;return q});
  return p.then(fetchWx).catch(function(e){
    failAt=Date.now();
    if(!(info&&info.ok))info={ok:false,kind:"clear",sr:0,ss:0,why:(e&&e.why)||"抓不到天氣",denied:!!(e&&e.denied)};
  }).then(function(){
    busy=false;saveCache();apply();
    if(pend){pend=false;if(on)say("跟隨當地:"+describe(),3500)}
    if(fromCache&&!recheck){recheck=true;relocate()}
  });
}
function toggle(){
  on=!on;ls(KEY,on?"1":"0");apply();
  if(!on){say("已關閉,使用預設背景");return}
  if(info&&(info.ok||info.denied)){say("跟隨當地:"+describe(),3500);return}
  say("正在取得當地天氣…",8000);pend=true;
  if(!busy)refresh(true);
}
btn.addEventListener("click",toggle);
setInterval(function(){if(on)apply();refresh(false)},60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){if(on)apply();refresh(false)}});
/* 一進頁面就先取天氣(不用等按開關);有快取的話畫面立刻就有 */
loadCache();on=(ls(KEY)==="1");apply();refresh(false);
})();
</script>
</body>
</html>
