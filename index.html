<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1422" media="(prefers-color-scheme: dark)">
<title>真心話轉盤</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="turn_config.js"></script>
<style>
:root{
 --bg1:#ffeef4;--bg2:#fff7fa;--glow:rgba(255,255,255,.85);
 --card:rgba(255,255,255,.8);--ink:#3a2434;--mute:#8f7585;--line:#f6d9e4;
 --pink:#ff6a96;--pink2:#ff9db8;--blue:#8f8cff;--blue2:#b9b3ff;--title:#d93a78;
 --shadow:0 12px 32px rgba(214,90,140,.14);
 --rim1:#ffffff;--rim2:#ffd0e0;--field:rgba(255,255,255,.88);
 --s1:rgba(255,255,255,.62);--s2:#ffd1e1;--s3:#ffb0cb;--lav:#d6caff;--cloud:rgba(255,255,255,.8)
}
@media (prefers-color-scheme:dark){:root{
 --bg1:#1f1329;--bg2:#2b1737;--glow:rgba(255,106,150,.14);
 --card:rgba(48,32,60,.82);--ink:#fbeff6;--mute:#bba4b8;--line:#493058;
 --title:#ff9fc4;--shadow:0 12px 32px rgba(0,0,0,.4);
 --rim1:#5a3a6e;--rim2:#3a2448;--field:rgba(0,0,0,.25);
 --s1:rgba(255,255,255,.05);--s2:#47285a;--s3:#633478;--lav:#4f4690;--cloud:rgba(255,255,255,.06)
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;min-height:100%;background-color:var(--bg1);
 background-image:radial-gradient(760px 460px at 15% -5%,var(--glow),transparent 65%),linear-gradient(180deg,var(--bg1),var(--bg2));
 background-repeat:no-repeat;background-size:100% 100%;overscroll-behavior:none}
body{margin:0;color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Hiragino Sans CNS",sans-serif;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;background:transparent;overscroll-behavior:none}

/* ---- 背景:粉色遊樂園 ---- */
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg svg{position:absolute;display:block}
.bg .scene{left:0;bottom:0;width:100%;height:auto;max-height:78vh;overflow:visible}
.bg .bunting{left:0;top:0;width:100%;height:clamp(44px,6vw,80px)}
.bg .s1{fill:var(--s1)}.bg .s2{fill:var(--s2)}.bg .s3{fill:var(--s3)}.bg .lv{fill:var(--lav)}.bg .cl{fill:var(--cloud)}
.bg .l3{stroke:var(--s3);fill:none;stroke-linecap:round}.bg .l2{stroke:var(--s2);fill:none;stroke-linecap:round}
.fw{transform-origin:680px 300px;animation:spin 120s linear infinite}
.bl{animation:floaty 7s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

main{position:relative;z-index:1;width:100%;max-width:520px;padding:max(22px,env(safe-area-inset-top)) 16px max(36px,env(safe-area-inset-bottom))}
header{text-align:center;margin:22px 0 20px}
.eyebrow{display:inline-block;font-size:12px;letter-spacing:.2em;font-weight:700;color:var(--title);padding:4px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
h1{margin:10px 0 4px;font-size:clamp(34px,9vw,46px);line-height:1.1;font-weight:800;letter-spacing:.06em;color:var(--title);text-shadow:0 2px 0 rgba(255,255,255,.6)}
@media (prefers-color-scheme:dark){h1{text-shadow:none}}
.sub{margin:0;font-size:14px;color:var(--mute)}

.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:20px;color:var(--title)}
.card .lead{margin:0 0 6px;font-size:13px;color:var(--mute)}
label{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:14px;font-weight:700;margin:16px 0 4px}
label em{font-style:normal;font-weight:400;font-size:12px;color:var(--mute)}
input[type=text]{width:100%;padding:13px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
input[type=text]::placeholder{color:var(--mute);opacity:.7}
input[type=text]:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,106,150,.18)}

button{font:inherit;border:0;border-radius:99px;padding:14px 18px;background:linear-gradient(135deg,#ff86ab,#ff5c8a);color:#fff;font-weight:800;font-size:17px;letter-spacing:.06em;cursor:pointer;width:100%;margin-top:18px;box-shadow:0 8px 20px rgba(255,92,138,.32);transition:transform .15s,box-shadow .15s,opacity .2s}
button:hover{transform:translateY(-1px)}button:active{transform:translateY(1px) scale(.99)}
button:focus-visible{outline:3px solid rgba(255,106,150,.5);outline-offset:3px}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600;font-size:13px;letter-spacing:0;width:auto;padding:9px 14px;margin:0}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
#spin{font-size:20px;padding:16px;margin-top:20px;background:linear-gradient(135deg,#ff86ab,#ff5c8a);box-shadow:0 0 0 6px rgba(255,255,255,.5),0 12px 26px rgba(255,92,138,.38)}
@media (prefers-color-scheme:dark){#spin{box-shadow:0 0 0 6px rgba(255,255,255,.08),0 12px 26px rgba(255,92,138,.3)}}
.small{font-size:13px;color:var(--mute)}
.hidden{display:none!important}

.players{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.pl{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-width:0;padding:8px 14px;border-radius:99px;font-weight:700;font-size:14px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pl::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:#fff;opacity:.9}
.pl0{justify-self:start;background:linear-gradient(135deg,var(--pink),var(--pink2))}.pl1{justify-self:end;background:linear-gradient(135deg,var(--blue),var(--blue2))}
.vs{justify-self:center;font-size:12px;font-weight:800;color:var(--mute);letter-spacing:.1em}
#status{text-align:center;margin-top:10px;min-height:18px}
#game>.card:first-child{position:relative;padding-top:24px}
.roomtab{position:absolute;top:-11px;right:16px;max-width:calc(100% - 32px);display:flex;align-items:center;gap:7px;padding:4px 12px 4px 9px;border-radius:99px;background:var(--bg2);border:1px solid var(--pink2);box-shadow:0 4px 10px rgba(214,90,140,.18)}
.roomlbl{flex:none;font-size:11px;font-weight:700;color:var(--mute)}
#roomtag{min-width:0;font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--title);overflow-wrap:anywhere;line-height:1.3}

/* ---- 轉盤(簡化) ---- */
.stage{display:flex;justify-content:center;margin:40px 0 22px}
.wheelwrap{position:relative;width:min(80vw,340px);aspect-ratio:1}
.ring{position:absolute;inset:-10px;border-radius:50%;background:linear-gradient(145deg,var(--rim1),var(--rim2));box-shadow:0 14px 34px rgba(214,90,140,.25)}
.pointer{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:28px solid #ff4f86;z-index:3;filter:drop-shadow(0 3px 3px rgba(120,20,60,.3))}
#wheel{position:relative;z-index:1;width:100%;height:100%;display:block;border-radius:50%}
#t0,#t1{paint-order:stroke;stroke:rgba(120,30,70,.28);stroke-width:2px}
.hub{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:15%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.55),0 4px 12px rgba(120,30,70,.3);pointer-events:none}
.hub::after{content:"";position:absolute;inset:32%;border-radius:50%;background:var(--pink)}

.result{text-align:center;position:relative;margin-top:16px;padding-top:26px;border:2px solid var(--pink2)}
.result::before{content:"Q";position:absolute;top:-17px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff86ab,#ff5c8a);box-shadow:0 4px 10px rgba(255,92,138,.4)}
.result:not(.hidden){animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.who{font-size:15px;color:var(--mute)}.who b{color:var(--ink);font-size:22px}
.me{color:var(--pink)!important}
.q{font-size:clamp(20px,5.4vw,24px);line-height:1.6;font-weight:800;padding:12px 2px 10px}
.tools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:6px}
#hist{margin-top:12px;max-height:320px;overflow:auto}
footer{text-align:center;margin-top:22px;font-size:12px;color:var(--mute)}

@media (min-width:760px){main{max-width:580px;padding-top:44px}.wheelwrap{width:380px}.card{padding:24px}}
@media (max-width:520px){
 main{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}
 header{margin:14px 0 12px}h1{margin:6px 0 2px}
 .card{padding:16px;margin-bottom:10px;border-radius:20px}
 .stage{margin:30px 0 16px}.wheelwrap{width:min(68vw,290px)}
 #spin{padding:13px;font-size:18px}.q{padding:8px 2px 6px}
 .result{margin-top:12px}footer{margin-top:14px}
}

/* ---- 蓄力按鈕特效 ---- */
#game{--p:0}
.spinwrap{position:relative}
#spin{position:relative;z-index:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#spin::before{content:"";position:absolute;z-index:-1;left:0;top:0;bottom:0;width:calc(var(--p)*100%);background:linear-gradient(90deg,#ffb36b,#ffe27a);border-radius:inherit;opacity:0}
#spin.charging{transition:none;animation:jitter .11s linear infinite;text-shadow:0 1px 3px rgba(150,40,60,.55);
 box-shadow:0 0 0 calc(6px + var(--p)*8px) rgba(255,170,90,calc(.2 + var(--p)*.35)),0 0 calc(var(--p)*44px) calc(var(--p)*8px) rgba(255,120,70,calc(var(--p)*.85)),0 12px 26px rgba(255,92,138,.38)}
#spin.charging::before{opacity:.95}
#spin.max{background:linear-gradient(135deg,#ff7a3d,#ff3d7a)}
@keyframes jitter{
 0%{transform:translate(0,0) scale(calc(1 + var(--p)*.04))}
 25%{transform:translate(calc(var(--p)*-2px),calc(var(--p)*1px)) scale(calc(1 + var(--p)*.04))}
 50%{transform:translate(calc(var(--p)*1.5px),calc(var(--p)*-1.5px)) scale(calc(1 + var(--p)*.04))}
 75%{transform:translate(calc(var(--p)*1px),calc(var(--p)*1.5px)) scale(calc(1 + var(--p)*.04))}
 100%{transform:translate(0,0) scale(calc(1 + var(--p)*.04))}}
.wheelwrap.charging{animation:jitter2 .09s linear infinite}
.wheelwrap.charging .ring{box-shadow:0 14px 34px rgba(214,90,140,.25),0 0 calc(var(--p)*56px) calc(var(--p)*12px) rgba(255,140,80,calc(var(--p)*.7))}
@keyframes jitter2{0%,100%{transform:translate(0,0)}33%{transform:translate(calc(var(--p)*-1.5px),calc(var(--p)*1px))}66%{transform:translate(calc(var(--p)*1.5px),calc(var(--p)*-1px))}}
.sp{position:absolute;pointer-events:none;width:9px;height:9px;margin:-4px 0 0 -4px;z-index:2;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spark .8s ease-out forwards}
@keyframes spark{from{opacity:1;transform:translate(0,0) scale(1) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}html[data-phase="day"]{--bg1:#ffe9f2;--bg2:#fff8fb;--glow:rgba(255,255,255,.9);--card:rgba(255,255,255,.8);--ink:#3a2434;--mute:#8f7585;--line:#f6d9e4;--title:#d93a78;--shadow:0 12px 32px rgba(214,90,140,.14);--rim1:#fff;--rim2:#ffd0e0;--field:rgba(255,255,255,.88);--s1:rgba(255,255,255,.62);--s2:#ffd1e1;--s3:#ffb0cb;--lav:#d6caff;--cloud:rgba(255,255,255,.8);--cloud2:rgba(255,255,255,.95);--fogc:rgba(208,202,226,.82);--rain:rgba(120,155,225,.6)}
html[data-phase="dawn"]{--bg1:#f6cfe6;--bg2:#ffe3c9;--glow:rgba(255,220,170,.7);--card:rgba(255,255,255,.8);--ink:#3a2434;--mute:#85626f;--line:#f2d3d8;--title:#d03a72;--shadow:0 12px 32px rgba(214,110,120,.16);--rim1:#fff;--rim2:#ffd0d0;--field:rgba(255,255,255,.88);--s1:rgba(255,255,255,.55);--s2:#ffd0c2;--s3:#ffb09f;--lav:#e9c4e6;--cloud:rgba(255,236,226,.85);--cloud2:rgba(255,238,230,.92);--fogc:rgba(230,216,222,.8);--rain:rgba(130,140,210,.6)}
html[data-phase="dusk"]{--bg1:#d3a0e6;--bg2:#ffc9a8;--glow:rgba(255,160,110,.35);--card:rgba(255,255,255,.82);--ink:#3a2434;--mute:#6f4a60;--line:#f0cfd8;--title:#b82a66;--shadow:0 12px 32px rgba(160,70,110,.2);--rim1:#fff;--rim2:#ffc6d6;--field:rgba(255,255,255,.88);--s1:rgba(255,255,255,.4);--s2:#e79fbd;--s3:#d57fa8;--lav:#b99be0;--cloud:rgba(255,205,190,.7);--cloud2:rgba(255,206,196,.88);--fogc:rgba(222,196,218,.75);--rain:rgba(120,110,200,.6)}
html[data-phase="night"]{--bg1:#150d2b;--bg2:#3a2050;--glow:rgba(255,106,150,.12);--card:rgba(48,32,60,.82);--ink:#fbeff6;--mute:#bba4b8;--line:#493058;--title:#ff9fc4;--shadow:0 12px 32px rgba(0,0,0,.4);--rim1:#5a3a6e;--rim2:#3a2448;--field:rgba(0,0,0,.25);--s1:rgba(255,255,255,.05);--s2:#47285a;--s3:#633478;--lav:#4f4690;--cloud:rgba(255,255,255,.06);--cloud2:rgba(150,130,200,.35);--fogc:rgba(120,100,160,.5);--rain:rgba(190,210,255,.55)}

/* ---- 天氣 / 時段背景(只有開啟太陽開關時才會生效)---- */
html[data-phase="day"],html[data-phase="dawn"],html[data-phase="dusk"]{--sunon:1}
html[data-phase="night"]{--moonon:1}
html[data-wx="clear"]{--cel:1;--cl:0;--tint:0}
html[data-wx="partly"]{--cel:.9;--cl:.55;--tint:0}
html[data-wx="cloudy"]{--cel:.3;--cl:1;--tint:.3}
html[data-wx="fog"]{--cel:.3;--cl:.5;--tint:0}
html[data-wx="rain"]{--cel:0;--cl:1;--tint:.38}
html[data-wx="snow"]{--cel:0;--cl:.9;--tint:.2}
html[data-wx="thunder"]{--cel:0;--cl:1;--tint:.5}
html[data-phase="day"] h1,html[data-phase="dawn"] h1,html[data-phase="dusk"] h1{text-shadow:0 2px 0 rgba(255,255,255,.6)}
html[data-phase="night"] h1{text-shadow:none}
html[data-phase="day"] #spin:not(.charging),html[data-phase="dawn"] #spin:not(.charging),html[data-phase="dusk"] #spin:not(.charging){box-shadow:0 0 0 6px rgba(255,255,255,.5),0 12px 26px rgba(255,92,138,.38)}
html[data-phase="night"] #spin:not(.charging){box-shadow:0 0 0 6px rgba(255,255,255,.08),0 12px 26px rgba(255,92,138,.3)}

.bg .stars,.bg .sun,.bg .moon,.bg .clouds,.bg .tint,.bg .fog,.bg .flash{position:absolute;opacity:0;pointer-events:none}
.bg .stars{left:0;top:0;width:100%;height:55%;opacity:calc(var(--moonon,0)*var(--cel,1));transition:opacity 1s}
.bg .stars circle{fill:#fff;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.3}}
.bg .sun{width:54px;height:54px;border-radius:50%;top:8%;left:4%;background:radial-gradient(circle at 40% 38%,#fffbe0,#ffd56a 65%,#ffb347);box-shadow:0 0 36px 14px rgba(255,208,100,.5);opacity:calc(var(--sunon,0)*var(--cel,1));transition:opacity 1s,top 1s,left 1s,box-shadow 1s}
html[data-phase="dawn"] .bg .sun{top:30%;left:5%;box-shadow:0 0 40px 16px rgba(255,160,100,.5);background:radial-gradient(circle at 40% 38%,#fff3d6,#ffc07a 65%,#ff9a5a)}
html[data-phase="dusk"] .bg .sun{top:34%;left:80%;box-shadow:0 0 44px 18px rgba(255,120,90,.5);background:radial-gradient(circle at 40% 38%,#ffe9c9,#ff9a6a 70%,#ff7a59)}
.bg .moon{width:50px;height:50px;top:7%;left:4%;filter:drop-shadow(0 0 12px rgba(255,243,200,.6));opacity:calc(var(--moonon,0)*var(--cel,1));transition:opacity 1s}
.bg .clouds{left:0;top:34px;width:100%;height:36%;opacity:var(--cl,0);transition:opacity 1s;filter:drop-shadow(0 3px 5px rgba(150,110,170,.4))}
.bg .clouds .c{fill:var(--cloud2);animation:drift 90s linear infinite}
html[data-wx="cloudy"] .bg .clouds,html[data-wx="snow"] .bg .clouds{filter:grayscale(.45) brightness(.9) drop-shadow(0 3px 5px rgba(120,100,150,.45))}
html[data-wx="rain"] .bg .clouds,html[data-wx="thunder"] .bg .clouds{filter:grayscale(.7) brightness(.72) drop-shadow(0 3px 6px rgba(70,60,100,.5))}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(560px)}}
.bg .tint{inset:0;background:#8d93ad;opacity:var(--tint,0);transition:opacity 1s}
html[data-phase="night"] .bg .tint{background:#241a3a}
.bg .fog{left:-4%;right:-4%;top:0;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,var(--fogc) 35%,var(--fogc) 100%);transition:opacity 1s}
html[data-wx="fog"] .bg .fog{opacity:1;animation:fogmove 18s ease-in-out infinite alternate}
@keyframes fogmove{from{transform:translateX(-2%)}to{transform:translateX(2%)}}
.bg .rain,.bg .snow{position:absolute;inset:0;display:none;overflow:hidden}
html[data-wx="rain"] .bg .rain,html[data-wx="thunder"] .bg .rain{display:block}
html[data-wx="snow"] .bg .snow{display:block}
.bg .rain i{position:absolute;top:-12vh;width:1.5px;background:linear-gradient(rgba(255,255,255,0),var(--rain));transform:rotate(14deg);animation:rainfall .8s linear infinite}
@keyframes rainfall{from{transform:translate(0,-10vh) rotate(14deg)}to{transform:translate(-30vh,112vh) rotate(14deg)}}
.bg .snow i{position:absolute;top:-4vh;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(140,160,230,.55),0 0 6px 2px rgba(255,255,255,.9);animation:snowfall 10s linear infinite}
@keyframes snowfall{0%{transform:translate(0,-5vh)}50%{transform:translate(22px,52vh)}100%{transform:translate(-10px,108vh)}}
.bg .flash{inset:0;background:#fff}
html[data-wx="thunder"] .bg .flash{animation:flash 7s linear infinite}
@keyframes flash{0%,90%,100%{opacity:0}91%{opacity:.7}92%{opacity:.05}93%{opacity:.55}95%{opacity:0}}
.bg .bulb{fill:#ffd98a;opacity:0;transition:opacity 1s}
html[data-phase="night"] .bg .bulb{opacity:1;filter:drop-shadow(0 0 4px rgba(255,217,138,.95))}
html[data-phase="night"] .bg .fw g.s3 circle{fill:#ffd98a;filter:drop-shadow(0 0 4px rgba(255,217,138,.9))}

/* ---- 太陽開關 ---- */
.skybtn{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 46px);right:14px;width:40px;height:40px;padding:0;margin:0;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;font-size:0;letter-spacing:0;color:#f59e0b;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.skybtn:hover{transform:none}
.skybtn svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;fill:none}
.skybtn circle{fill:#ffd36b}
.skybtn[aria-pressed="false"]{color:var(--mute)}
.skybtn[aria-pressed="false"] circle{fill:none}
.skybtn .halo,.skybtn .slash{display:none}
.skybtn .halo{stroke:var(--bg2);stroke-width:4.4}
.skybtn[aria-pressed="false"] .halo,.skybtn[aria-pressed="false"] .slash{display:inline}
.skytoast{position:fixed;z-index:6;right:14px;top:calc(env(safe-area-inset-top,0px) + 92px);max-width:min(72vw,260px);padding:8px 12px;border-radius:14px;background:var(--bg2);border:1px solid var(--pink2);box-shadow:var(--shadow);font-size:12.5px;line-height:1.45;color:var(--ink);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s;pointer-events:none}
.skytoast.show{opacity:1;transform:none}

  if(busy||!connected)return;
  pw=Math.max(0,Math.min(1,Number(pw)||0));
  var v0=870+pw*1330,dur=3.4+pw*1.6,turns=Math.max(3,Math.round(v0*dur/2.77/360-.5));
  var d={type:"spin",t:Math.random()<.5?0:1,off:20+Math.random()*140,turns:turns,dur:dur,pw:pw,q:q};
  conn.send(d);runSpin(d);
}
function runSpin(d){
  if(busy)return;
  var t=d.t===1?1:0,off=Math.max(15,Math.min(165,Number(d.off)||90)),turns=Math.max(3,Math.min(14,Number(d.turns)||3)),dur=Math.max(2.5,Math.min(6.5,Number(d.dur)||4.6)),pw=Math.max(0,Math.min(1,Number(d.pw)||0));
  var q=typeof d.q==="string"?d.q.slice(0,300):"(空白題目)";
  if(used.indexOf(q)<0){used.push(q);saveUsed()}
  busy=true;$("spin").disabled=true;$("result").classList.add("hidden");$("status").textContent="轉動中…"+(d.pw!=null?"(力道 "+Math.round(pw*100)+"%)":"");
  var prev=rot;
  var base=prev+360*turns,tgt=-(t*180+off);
  rot=base+((((tgt-base)%360)+360)%360);
  var w=$("wheel");w.style.transition="transform "+dur+"s cubic-bezier(.22,.61,.36,1)";w.style.transform="rotate("+rot+"deg)";
  playSpin(rot-prev,dur);
  clearTimeout(timer);
  timer=setTimeout(function(){
    var mine=(t===meIdx()),nm=names()[t]||"?";
    addHist(q,nm);
    var who=$("who");who.textContent="";
    var a=document.createElement("span");a.textContent="輪到 ";
    var b=document.createElement("b");b.textContent=nm;if(mine)b.className="me";
    var c=document.createElement("span");c.textContent=mine?" 回答!(就是你)":" 回答!";
    who.appendChild(a);who.appendChild(b);who.appendChild(c);
    $("question").textContent=q;$("result").classList.remove("hidden");$("status").textContent="";
  },Math.round(dur*1000)+100);
}
function doNext(){
  if(!busy)return;
  clearTimeout(timer);busy=false;$("result").classList.add("hidden");render();
}
$("nm").value=load("tod_name")||"";$("rm").value=load("tod_room")||"";
$("snd").onclick=function(){muted=!muted;save("tod_mute",muted?"1":"0");renderSnd();audio()};
renderSnd();
$("hbtn").onclick=function(){$("hist").classList.toggle("hidden")};
function clearMem(){used=[];hist=[];saveUsed();saveHist();renderHist()}
$("hclr").onclick=function(){
  if(!confirm(connected?"清除雙方的歷史紀錄和已抽過的題目?":"清除這台裝置上的歷史紀錄和已抽過的題目?(對方未連線,不會同步)"))return;
  clearMem();
  if(connected&&conn)conn.send({type:"clear"});
};
$("go").onclick=start;
/* ===== 按住蓄力 ===== */
var HOLD_MAX=1800,ch=null,spinBtn=$("spin"),wheelWrap=document.querySelector(".wheelwrap"),gameEl=$("game"),spWrap=document.querySelector(".spinwrap");
var reduceMotion=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
var SPARK=["#ffd36b","#ffffff","#ff9ec0","#ffb36b","#c6baff"];
function setPower(p){gameEl.style.setProperty("--p",p.toFixed(3))}
function toneStart(){
  if(muted)return null;var c=audio();if(!c)return null;
  try{var o=c.createOscillator(),g=c.createGain();o.type="triangle";o.frequency.value=200;
    g.gain.setValueAtTime(0.0001,c.currentTime);g.gain.linearRampToValueAtTime(0.05,c.currentTime+0.06);
    o.connect(g);g.connect(c.destination);o.start();return{o:o,g:g}}catch(e){return null}
}
function toneSet(h,p){if(h&&actx){try{h.o.frequency.setTargetAtTime(200+p*760,actx.currentTime,0.03)}catch(e){}}}
function toneStop(h){if(h&&actx){try{h.g.gain.setTargetAtTime(0.0001,actx.currentTime,0.03);h.o.stop(actx.currentTime+0.2)}catch(e){}}}
function spark(x,y,dx,dy){
  var e=document.createElement("i");e.className="sp";
  e.style.left=x+"px";e.style.top=y+"px";e.style.setProperty("--dx",dx+"px");e.style.setProperty("--dy",dy+"px");
  e.style.background=SPARK[Math.floor(Math.random()*SPARK.length)];
  spWrap.appendChild(e);setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e)},850);
}
function sparkRise(){
  var w=spWrap.offsetWidth,h=spWrap.offsetHeight;
  spark(Math.random()*w,h*(.2+Math.random()*.6),(Math.random()-.5)*50,-(30+Math.random()*60));
}
function sparkBurst(p){
  var w=spWrap.offsetWidth,h=spWrap.offsetHeight,n=8+Math.round(p*18);
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,r=50+Math.random()*(70+p*70);
    spark(w/2+(Math.random()-.5)*w*.5,h/2,Math.cos(a)*r,Math.sin(a)*r*.8);
  }
}
function chargeLoop(){
  if(!ch)return;
  if(spinBtn.disabled||!connected||busy){chargeEnd(false);return}
  var p=Math.min(1,(performance.now()-ch.t0)/HOLD_MAX);ch.p=p;
  setPower(p);toneSet(ch.tone,p);
  var pct=Math.round(p*100);
  if(pct!==ch.pct){
    ch.pct=pct;
    spinBtn.textContent=p>=1?"MAX!  放開!":"蓄力中… "+pct+"%";
    if(p>=1)spinBtn.classList.add("max");
    var step=Math.floor(p*4);
    if(step>ch.step){ch.step=step;try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}}
  }
  if(!reduceMotion&&Math.random()<.08+p*.4)sparkRise();
  ch.raf=requestAnimationFrame(chargeLoop);
}
function chargeStart(e){
  if(ch||spinBtn.disabled||!connected||busy)return;
  if(e&&e.pointerId!=null){try{spinBtn.setPointerCapture(e.pointerId)}catch(x){}}
  audio();
  ch={t0:performance.now(),p:0,pct:-1,step:0,raf:0,tone:toneStart()};
  spinBtn.classList.add("charging");wheelWrap.classList.add("charging");
  chargeLoop();
}
function chargeEnd(fire){
  if(!ch)return;
  var p=Math.min(1,(performance.now()-ch.t0)/HOLD_MAX);
  cancelAnimationFrame(ch.raf);toneStop(ch.tone);ch=null;
  spinBtn.classList.remove("charging","max");wheelWrap.classList.remove("charging");
  setPower(0);spinBtn.textContent="轉!";
  if(fire&&connected&&!busy&&!spinBtn.disabled){
    if(!reduceMotion)sparkBurst(p);
    var q=nextQuestion();
    if(isHost)doSpin(q,p);
    else{conn.send({type:"req",q:q,pw:p});spinBtn.disabled=true;setTimeout(function(){if(!busy)render()},3000)}
  }
}
spinBtn.addEventListener("pointerdown",function(e){if(e.button>0)return;e.preventDefault();chargeStart(e)});
spinBtn.addEventListener("pointerup",function(){chargeEnd(true)});
spinBtn.addEventListener("pointercancel",function(){chargeEnd(false)});
spinBtn.addEventListener("lostpointercapture",function(){chargeEnd(false)});
spinBtn.addEventListener("contextmenu",function(e){e.preventDefault()});
spinBtn.addEventListener("keydown",function(e){if((e.key===" "||e.key==="Enter")&&!e.repeat){e.preventDefault();chargeStart()}});
spinBtn.addEventListener("keyup",function(e){if(e.key===" "||e.key==="Enter"){e.preventDefault();chargeEnd(true)}});
spinBtn.addEventListener("blur",function(){chargeEnd(false)});
$("next").onclick=function(){if(connected)conn.send({type:"next"});doNext()};
/* ===== 天氣 / 時段背景(太陽開關)===== */
var SKY_KEY="tod_sky",WX_KEY="tod_wx",LOC_KEY="tod_loc";
var skyOn=false,skyBtn=$("skybtn"),skyToastT=null,skyTick=null,skyPoll=null,preview=null;
var TZ={"Asia/Taipei":[25.0,121.5],"Asia/Tokyo":[35.7,139.7],"Asia/Seoul":[37.6,127.0],"Asia/Hong_Kong":[22.3,114.2],"Asia/Shanghai":[31.2,121.5],"Asia/Singapore":[1.3,103.8],"Asia/Bangkok":[13.8,100.5],"Asia/Kuala_Lumpur":[3.1,101.7],"Asia/Manila":[14.6,121.0],"Asia/Ho_Chi_Minh":[10.8,106.7],"Asia/Dubai":[25.2,55.3],"Asia/Kolkata":[28.6,77.2],"Australia/Sydney":[-33.9,151.2],"Australia/Melbourne":[-37.8,145.0],"Pacific/Auckland":[-36.8,174.8],"Pacific/Honolulu":[21.3,-157.9],"Europe/London":[51.5,-0.1],"Europe/Paris":[48.9,2.4],"Europe/Berlin":[52.5,13.4],"Europe/Madrid":[40.4,-3.7],"Europe/Rome":[41.9,12.5],"Europe/Amsterdam":[52.4,4.9],"Europe/Moscow":[55.8,37.6],"America/New_York":[40.7,-74.0],"America/Chicago":[41.9,-87.6],"America/Denver":[39.7,-105.0],"America/Los_Angeles":[34.1,-118.2],"America/Vancouver":[49.3,-123.1],"America/Toronto":[43.7,-79.4],"America/Sao_Paulo":[-23.6,-46.6]};
var WXN={clear:"晴天",partly:"晴時多雲",cloudy:"多雲",fog:"有霧",rain:"下雨",snow:"下雪",thunder:"雷雨"},PHN={dawn:"清晨",day:"白天",dusk:"傍晚",night:"夜晚"};
function skyToast(msg){var t=$("skytoast");t.textContent=msg;t.classList.add("show");clearTimeout(skyToastT);skyToastT=setTimeout(function(){t.classList.remove("show")},2800)}
function wxClass(c){
  if(c===0)return"clear";if(c===1||c===2)return"partly";if(c===3)return"cloudy";
  if(c===45||c===48)return"fog";
  if((c>=51&&c<=67)||(c>=80&&c<=82))return"rain";
  if((c>=71&&c<=77)||c===85||c===86)return"snow";
  if(c>=95)return"thunder";return"cloudy";
}
function hmToMin(s){var m=/T(\d\d):(\d\d)/.exec(s||"");return m?(+m[1])*60+(+m[2]):null}
function phaseFrom(now,rise,set){
  if(rise==null||set==null){var h=now/60;return h>=5&&h<7?"dawn":h>=7&&h<17?"day":h>=17&&h<19?"dusk":"night"}
  if(now>=rise-45&&now<rise+60)return"dawn";
  if(now>=rise+60&&now<set-60)return"day";
  if(now>=set-60&&now<set+45)return"dusk";
  return"night";
}
function readJSON(k){try{return JSON.parse(load(k))}catch(e){return null}}
function skyState(){
  if(preview)return{wx:preview[0],ph:preview[1]};
  var c=readJSON(WX_KEY);
  if(c&&Date.now()-c.t<6*3600e3){
    var now=(((Date.now()/1000+c.off)%86400)+86400)%86400/60;
    return{wx:wxClass(c.code),ph:phaseFrom(now,c.rise,c.set)};
  }
  var n=new Date();return{wx:"clear",ph:phaseFrom(n.getHours()*60+n.getMinutes(),null,null)};
}
function applySky(){
  var el=document.documentElement;
  if(!skyOn){el.removeAttribute("data-phase");el.removeAttribute("data-wx");return}
  var st=skyState();el.setAttribute("data-phase",st.ph);el.setAttribute("data-wx",st.wx);
}
function getLoc(cb){
  var c=readJSON(LOC_KEY);
  if(c&&c.src==="gps"&&Date.now()-c.t<6*3600e3){cb(c);return}
  function fallback(){
    var z=null;try{z=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}
    var p=TZ[z];cb(p?{lat:p[0],lon:p[1],src:"tz",t:Date.now()}:null);
  }
  if(!navigator.geolocation){fallback();return}
  navigator.geolocation.getCurrentPosition(function(pos){
    var o={lat:Math.round(pos.coords.latitude*10)/10,lon:Math.round(pos.coords.longitude*10)/10,src:"gps",t:Date.now()};
    save(LOC_KEY,JSON.stringify(o));cb(o);
  },fallback,{timeout:8000,maximumAge:3600000});
}
function fetchWx(loc){
  var u="https://api.open-meteo.com/v1/forecast?latitude="+loc.lat+"&longitude="+loc.lon+"&current=weather_code,is_day&daily=sunrise,sunset&timezone=auto&forecast_days=1";
  return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    if(!d||!d.current)throw 0;
    var dl=d.daily||{};
    var o={t:Date.now(),code:d.current.weather_code,rise:hmToMin(dl.sunrise&&dl.sunrise[0]),set:hmToMin(dl.sunset&&dl.sunset[0]),off:d.utc_offset_seconds||0};
    save(WX_KEY,JSON.stringify(o));return o;
  });
}
function skyRefresh(force,loud){
  if(!skyOn||preview)return;
  var c=readJSON(WX_KEY);
  if(!force&&c&&Date.now()-c.t<30*60e3){applySky();return}
  getLoc(function(loc){
    if(!loc){applySky();if(loud)skyToast("無法判斷位置,先依時間變化背景");return}
    fetchWx(loc).then(function(){
      applySky();
      if(loud){var st=skyState();skyToast("跟隨當地:"+PHN[st.ph]+"・"+WXN[st.wx]+(loc.src==="tz"?"(依時區推測位置)":""))}
    }).catch(function(){applySky();if(loud)skyToast("天氣取得失敗,先依時間變化背景")});
  });
}
function skyUI(){
  skyBtn.setAttribute("aria-pressed",skyOn?"true":"false");
  skyBtn.title=skyOn?"天氣背景:跟隨當地(再按一次關閉)":"天氣背景:關(按一下開啟)";
  $("wxcredit").classList.toggle("hidden",!skyOn||!!preview);
}
function skyStart(loud){
  applySky();skyRefresh(!!loud,!!loud);
  clearInterval(skyTick);clearInterval(skyPoll);
  skyTick=setInterval(applySky,60000);
  skyPoll=setInterval(function(){skyRefresh(false,false)},15*60000);
}
function skyStop(){clearInterval(skyTick);clearInterval(skyPoll);applySky()}
skyBtn.addEventListener("click",function(){
  preview=null;skyOn=!skyOn;save(SKY_KEY,skyOn?"1":"0");skyUI();
  if(skyOn){skyStart(true);skyToast("已開啟:背景跟隨當地的時間與天氣")}
  else{skyStop();skyToast("已關閉:使用預設背景")}
});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&skyOn){applySky();skyRefresh(false,false)}});
(function(){
  var m=/[?&]scene=(clear|partly|cloudy|fog|rain|snow|thunder)-(dawn|day|dusk|night)(?:&|$)/.exec(location.search);
  if(m){preview=[m[1],m[2]];skyOn=true}else skyOn=load(SKY_KEY)==="1";
  skyUI();if(skyOn)skyStart(false);
})();
})();
</script>
