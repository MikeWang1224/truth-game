}).catch(function(){});

var actx=null,muted=load("tod_mute")==="1";
function audio(){try{if(!actx){var C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state==="suspended")actx.resume()}catch(e){}return actx}
function beep(t,f,dur,vol,type){var o=actx.createOscillator(),g=actx.createGain();o.type=type||"square";o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02)}
function bez(p,a,b){var u=1-p;return 3*u*u*p*a+3*u*p*p*b+p*p*p}
function playSpin(angle,dur){
  if(muted)return;var c=audio();if(!c)return;
  try{
    var t0=c.currentTime+0.05,peg=36,n=Math.floor(angle/peg),last=-1;
    for(var k=1;k<=n;k++){
      var y=k*peg/angle,lo=0,hi=1;
      for(var i=0;i<24;i++){var m=(lo+hi)/2;if(bez(m,.7,1)<y)lo=m;else hi=m}
      var tt=bez((lo+hi)/2,.12,.1)*dur;
      if(tt-last<0.025)continue;last=tt;
      beep(t0+tt,900+(k%2)*120,0.03,0.07,"square");
    }
    beep(t0+dur+0.05,880,0.5,0.2,"sine");beep(t0+dur+0.05,1320,0.6,0.12,"sine");
  }catch(e){}
}
function renderSnd(){$("snd").textContent=muted?"🔇 音效關":"🔊 音效開"}
var roomCode="default",hist=[];
function saveUsed(){save("tod_used_"+roomCode,JSON.stringify(used))}
function saveHist(){save("tod_hist_"+roomCode,JSON.stringify(hist))}
function renderHist(){
  $("hbtn").textContent="📖 歷史紀錄("+hist.length+")";
  var box=$("hist");box.textContent="";
  if(!hist.length){box.textContent="還沒有紀錄";return}
  hist.slice().reverse().forEach(function(h){
    var d=document.createElement("div");d.style.cssText="padding:8px 0;border-bottom:1px solid var(--line)";
    var a=document.createElement("div");a.style.cssText="color:var(--ink);font-size:15px";a.textContent=h.q;
    var b=document.createElement("div");b.textContent="回答:"+h.n+" · "+new Date(h.ts).toLocaleString();
    d.appendChild(a);d.appendChild(b);box.appendChild(d);
  });
}
function loadMem(){
  try{used=JSON.parse(load("tod_used_"+roomCode)||"[]")}catch(e){used=[]}
  try{hist=JSON.parse(load("tod_hist_"+roomCode)||"[]")}catch(e){hist=[]}
  if(!Array.isArray(used))used=[];if(!Array.isArray(hist))hist=[];
  renderHist();
}
function addHist(q,nm){hist.push({q:q,n:nm,ts:Date.now()});if(hist.length>300)hist=hist.slice(-300);saveHist();renderHist()}
function nextQuestion(){
  var pool=bank.length?bank:DEFAULTS;
  var left=pool.filter(function(q){return used.indexOf(q)<0});
  if(!left.length){used=[];saveUsed();left=pool.slice()}
  var q=left[Math.floor(Math.random()*left.length)];return q;
}
function short(n){return n.length>6?n.slice(0,6)+"…":n}
function names(){return isHost?[myName,oppName]:[oppName,myName]}
function meIdx(){return isHost?0:1}
function render(msg){
  var n=names(),me=meIdx();
  $("p0").textContent=n[0]?n[0]+(me===0?"(你)":""):"等待對方…";
  $("p1").textContent=n[1]?n[1]+(me===1?"(你)":""):"等待對方…";
  $("t0").textContent=short(n[0]);$("t1").textContent=short(n[1]);
  $("spin").disabled=!(connected&&!busy);
  if(msg)$("status").textContent=msg;
  else if(!busy)$("status").textContent=connected?"兩人到齊,任何一方都可以按「轉!」":"等待對方加入…(請對方輸入相同房間代號)";
}

function start(){
  audio();
  myName=$("nm").value.trim()||NAMES[Math.floor(Math.random()*NAMES.length)]+Math.floor(Math.random()*90+10);
  var code=($("rm").value.trim()||"default").toLowerCase().replace(/[^a-z0-9]/g,"")||"default";
  hostId="tod-"+code+"-host";
  roomCode=code;save("tod_name",$("nm").value.trim());save("tod_room",$("rm").value.trim());loadMem();
  $("setup").classList.add("hidden");$("game").classList.remove("hidden");
  render("連線中…");
  if(typeof Peer==="undefined"){render("⚠️ 無法載入連線元件,請檢查網路");return}
  becomeHost();
}
function becomeHost(){
  peer=new Peer(hostId,PEER_OPTS);
  peer.on("open",function(){isHost=true;render()});
  peer.on("connection",function(c){if(conn&&connected){c.close();return}setup(c)});
  peer.on("error",function(e){
    if(e.type==="unavailable-id"){try{peer.destroy()}catch(x){}becomeGuest()}
    else render("⚠️ 連線錯誤:"+e.type);
  });
}
function becomeGuest(){
  isHost=false;
  peer=new Peer(undefined,PEER_OPTS);
  peer.on("open",function(){setup(peer.connect(hostId,{reliable:true}))});
  peer.on("error",function(e){render(e.type==="peer-unavailable"?"⚠️ 找不到房間,請對方重新進入":"⚠️ 連線錯誤:"+e.type)});
}
function setup(c){
  conn=c;
  var opened=function(){connected=true;c.send({type:"hello",name:myName});render()};
  c.on("open",opened);if(c.open)opened();
  c.on("data",onData);
  c.on("close",function(){connected=false;oppName="";busy=false;clearTimeout(timer);$("result").classList.add("hidden");render("對方已離線,等待重新連線…");if(!isHost){isHost=false}});
  c.on("error",function(){render("⚠️ 連線中斷(兩邊網路可能無法直連,需設定 TURN)")});
}
function onData(d){
  if(!d||typeof d!=="object")return;
  if(d.type==="hello"){oppName=String(d.name||"對方").slice(0,12);render()}
  else if(d.type==="req"&&isHost){doSpin(typeof d.q==="string"?d.q:nextQuestion())}
  else if(d.type==="spin"&&!isHost){runSpin(d)}
  else if(d.type==="next"){doNext()}
  else if(d.type==="clear"){clearMem();$("status").textContent="對方已清除記憶"}
}
function doSpin(q){
  if(busy||!connected)return;
  var d={type:"spin",t:Math.random()<.5?0:1,off:20+Math.random()*140,turns:5+Math.floor(Math.random()*3),q:q};
  conn.send(d);runSpin(d);
}
function runSpin(d){
  if(busy)return;
  var t=d.t===1?1:0,off=Math.max(15,Math.min(165,Number(d.off)||90)),turns=Math.max(4,Math.min(8,Number(d.turns)||5));
  var q=typeof d.q==="string"?d.q.slice(0,300):"(空白題目)";
  if(used.indexOf(q)<0){used.push(q);saveUsed()}
  busy=true;$("spin").disabled=true;$("result").classList.add("hidden");$("status").textContent="轉動中…";
  var prev=rot;
  var cur=rot-(((rot%360)+360)%360);
  rot=cur+360*turns-(t*180+off);
  var w=$("wheel");w.style.transition="transform 4.6s cubic-bezier(.12,.7,.1,1)";w.style.transform="rotate("+rot+"deg)";
  playSpin(rot-prev,4.6);
  clearTimeout(timer);
  timer=setTimeout(function(){
    var mine=(t===meIdx()),nm=names()[t]||"?";
    addHist(q,nm);
    var who=$("who");who.textContent="";
    var a=document.createElement("span");a.textContent="輪到 ";
    var b=document.createElement("b");b.textContent=nm;if(mine)b.className="me";
    var c=document.createElement("span");c.textContent=mine?" 回答!(就是你)":" 回答!";
    who.appendChild(a);who.appendChild(b);who.appendChild(c);
    $("question").textContent=q;$("result").classList.remove("hidden");$("status").textContent="";
  },4700);
}
function doNext(){
  if(!busy)return;
  clearTimeout(timer);busy=false;$("result").classList.add("hidden");render();
}
$("nm").value=load("tod_name")||"";$("rm").value=load("tod_room")||"";
$("snd").onclick=function(){muted=!muted;save("tod_mute",muted?"1":"0");renderSnd();audio()};
renderSnd();
$("hbtn").onclick=function(){$("hist").classList.toggle("hidden")};
function clearMem(){used=[];hist=[];saveUsed();saveHist();renderHist()}
$("hclr").onclick=function(){
  if(!confirm(connected?"清除雙方的歷史紀錄和已抽過的題目?":"清除這台裝置上的歷史紀錄和已抽過的題目?(對方未連線,不會同步)"))return;
  clearMem();
  if(connected&&conn)conn.send({type:"clear"});
};
$("go").onclick=start;
$("spin").onclick=function(){
  if(!connected||busy)return;
  var q=nextQuestion();
  if(isHost)doSpin(q);else{conn.send({type:"req",q:q});$("spin").disabled=true;setTimeout(function(){if(!busy)render()},3000)}
};
$("next").onclick=function(){if(connected)conn.send({type:"next"});doNext()};
})();
</script>
</body>
</html>
